# /etc/nginx/sites-available/yourdomain.conf
# Symlink: ln -s /etc/nginx/sites-available/yourdomain.conf /etc/nginx/sites-enabled/
#
# Production Nginx Configuration for Hostinger VPS behind Cloudflare
# Enforces TLS 1.2/1.3, HSTS, Cloudflare Real IP restoration, strict request caps,
# and blocks all backend source code, configuration files, and direct upload access.

# 1. Restore Real Visitor IP from Cloudflare Header
include /etc/nginx/cloudflare-realip.conf;

# 2. Redirect all HTTP traffic to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name divinefingershealthcare.ca www.divinefingershealthcare.ca;

  # Allow Let's Encrypt ACME challenges
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://divinefingershealthcare.ca$request_uri;
  }
}

# 3. Main Hardened HTTPS Virtual Host
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name divinefingershealthcare.ca www.divinefingershealthcare.ca;

  # Cloudflare Origin Certificate & Private Key (or Let's Encrypt certificates)
  ssl_certificate         /etc/ssl/origin/fullchain.pem;
  ssl_certificate_key     /etc/ssl/origin/privkey.pem;

  # Strict TLS Protocols & Cipher Suites
  ssl_protocols           TLSv1.2 TLSv1.3;
  ssl_ciphers             HIGH:!aNULL:!MD5:!3DES:!CAMELLIA;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout     1d;
  ssl_session_cache       shared:SSL:10m;
  ssl_session_tickets     off;

  # Security Headers (Defense-in-Depth)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Request limits (keep in sync with Express/Multer 15MB limit)
  client_max_body_size    15m;
  client_body_timeout     15s;
  client_header_timeout   15s;
  send_timeout            30s;
  keepalive_timeout       30s;

  # Block hidden files (.env, .git) except ACME webroot
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  # Block source code, schema, config and secret file downloads
  location ~* \.(sql|py|bak|log|ini|md|yml|yaml|env|sh|conf)$ {
    deny all;
    return 404;
  }

  # Block direct static access to uploads (Must be served via authenticated /api/documents)
  location ^~ /uploads/ {
    deny all;
    return 404;
  }

  # Rate-limited proxy for sensitive authentication and reset endpoints
  location ~ ^/(api/)?(auth|login|forgot-password|reset-password) {
    include /etc/nginx/snippets/app-proxy.conf;
  }

  # Proxy all application requests to Node.js backend
  location / {
    include /etc/nginx/snippets/app-proxy.conf;
  }
}
